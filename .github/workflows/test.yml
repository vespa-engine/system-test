name: Test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

defaults:
  run:
    # Specify to ensure "pipefail and errexit" are set.
    # Ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RUBYLIB: ${{ github.workspace }}/lib

    steps:
      - uses: actions/checkout@v4

      # Keep in sync with the Ruby version in vespaengine/vespa-build-almalinux-8.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: install-gems
        run: gem install --no-document test-unit ffi concurrent-ruby parallel builder rexml

      - name: require-test-files
        run: |
          export VESPA_FACTORY_NO_AUTORUNNER=1
          for FILE in $(find tests -name "*.rb"); do
            ruby  -I lib -I tests -I . -e "require '$FILE'"
          done

      - name: run-unit-tests
        run: |
          set -e
          cd ${RUBYLIB}
          ruby test/testrunner.rb
          exit $?
